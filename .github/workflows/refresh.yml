name: Actualizar catálogo
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/harvest/requirements.txt
      - name: Preparar lectura de convocatorias PDF
        run: python -m pip install -r scripts/harvest/requirements.txt
      - name: Comprobar las reglas de extracción
        run: |
          python scripts/harvest/test_pdf_text.py
          npm test
      - name: Descubrir y comprobar vacantes
        run: npm run harvest
      - name: Comprobar programas y financiación
        run: npm run harvest:programmes
      - name: Revisar páginas que dejaron de aparecer
        run: npm run harvest:verify
      - name: Continuar el inventario de fuentes institucionales
        run: npm run harvest:institutions
      - name: Auditar el catálogo resultante
        run: npm run harvest:audit
      - name: Publicar el catálogo en Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:sync
      - name: Publicar el avance del inventario institucional
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:sync:institutions
      - name: Guardar la edición pública
        run: |
          git config user.name 'trama-catalogue[bot]'
          git config user.email 'trama-catalogue[bot]@users.noreply.github.com'
          git add data/catalogue.json data/institutions.json data/institutions.parts data/institutions.snapshot.mjs data/institution-crawl.json.gz data/institution-crawl.parts data/institution-crawl.summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified academic catalogue [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Conservar diagnóstico de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-diagnostics
          path: |
            .cache/audit.json
            .cache/harvest-progress.json
            data/institution-crawl.json.gz
            data/institution-crawl.parts
            data/institution-crawl.summary.json
          retention-days: 14
          if-no-files-found: ignore

name: Verificar aplicación
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/harvest/requirements.txt
      - run: python -m pip install -r scripts/harvest/requirements.txt
      - run: python scripts/harvest/test_pdf_text.py
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
